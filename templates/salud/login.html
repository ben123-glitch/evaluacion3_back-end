{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Vitalis{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0 fw-bold"><i class="fa-solid fa-user-lock me-2"></i>Acceso a Plataforma</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de Usuario</label>
                        <input type="text" name="username" class="form-control" required autofocus placeholder="Ej: admin o paciente">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket me-1"></i> Iniciar Sesión</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center bg-light py-3">
                <span class="text-muted">¿No tienes cuenta?</span> <a href="{% url 'registro' %}" class="fw-semibold">Regístrate aquí</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
